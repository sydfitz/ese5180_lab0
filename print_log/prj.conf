# Console output for sum_printk() / sum_log()
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

# Used when CONFIG_SUM_LOG is selected (sets its default verbosity to INFO)
CONFIG_LOG_DEFAULT_LEVEL=3

# CONFIG_SENSOR, CONFIG_I2C, and CONFIG_CBPRINTF_FP_SUPPORT are selected
# automatically by CONFIG_TEMP_READ in Kconfig
