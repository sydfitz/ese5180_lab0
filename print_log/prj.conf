# Console output for sum_printk() / sum_log()
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

# Used when CONFIG_SUM_LOG is selected (sets its default verbosity to INFO)
CONFIG_LOG_DEFAULT_LEVEL=3

# CONFIG_SENSOR, CONFIG_I2C, and CONFIG_CBPRINTF_FP_SUPPORT are selected
# automatically by CONFIG_TEMP_READ in Kconfig

# TWIM1/SPIM1/UARTE1 share one hardware block ("Serial-Box 1") on the
# nRF5340. TF-M's default secure logging UART (CONFIG_TFM_SECURE_UART1)
# claims that whole block as Secure, which blocks our i2c1 (TWIM1) from
# being accessed by the non-secure app -- causing a SecureFault/HardFault
# the moment nrfx_twim_init() touches its registers. Silencing TF-M's
# secure-side logging (rather than just CONFIG_TFM_SECURE_UART=n, which
# leaves TF-M's fault-dump code linked against a UART driver that no
# longer exists) removes the UART1 claim and frees Serial-Box 1 for
# non-secure use.
CONFIG_TFM_LOG_LEVEL_SILENCE=y
